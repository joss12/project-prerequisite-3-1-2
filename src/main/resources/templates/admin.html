<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">

    <div class="container-fluid">

        <div class="text-white">

            <strong th:text="${authenticatedUser.email}">
                admin@example.com
            </strong>

            <span> with roles: </span>

            <span th:each="role, stat : ${authenticatedUser.roles}">

                <span th:text="${#strings.replace(
                        role.name,
                        'ROLE_',
                        ''
                )}">
                    ADMIN
                </span>

                <span th:if="${!stat.last}">, </span>

            </span>

        </div>

        <form th:action="@{/logout}"
              method="post"
              class="m-0">

            <button type="submit"
                    class="btn btn-link text-secondary text-decoration-none">
                Logout
            </button>

        </form>

    </div>

</nav>

<div class="container-fluid">

    <div class="row">

        <aside class="col-md-2 px-0 pt-3 min-vh-100 bg-white">

            <div class="nav flex-column nav-pills">

                <a class="nav-link active rounded-0"
                   th:href="@{/admin}">
                    Admin
                </a>

                <a class="nav-link rounded-0"
                   th:href="@{/user}">
                    User
                </a>

            </div>

        </aside>

        <main class="col-md-10 bg-light min-vh-100 p-4">

            <h1 class="h2 mb-4">
                Admin panel
            </h1>

            <ul class="nav nav-tabs"
                id="adminTabs"
                role="tablist">

                <li class="nav-item"
                    role="presentation">

                    <button class="nav-link active"
                            id="users-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#users-pane"
                            type="button"
                            role="tab">

                        All Users

                    </button>

                </li>

                <li class="nav-item"
                    role="presentation">

                    <button class="nav-link"
                            id="new-user-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#new-user-pane"
                            type="button"
                            role="tab">

                        New User

                    </button>

                </li>

            </ul>

            <div class="tab-content">

                <div class="tab-pane fade show active"
                     id="users-pane"
                     role="tabpanel">

                    <div class="card rounded-0 rounded-bottom">

                        <div class="card-header">

                            <h5 class="mb-0">
                                All users
                            </h5>

                        </div>

                        <div class="card-body">

                            <div class="table-responsive">

                                <table class="table table-striped align-middle">

                                    <thead>

                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>

                                    </thead>

                                    <tbody id="usersTableBody">
                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                    <div class="modal fade"
                         id="editUserModal"
                         tabindex="-1"
                         aria-hidden="true">

                        <div class="modal-dialog">

                            <div class="modal-content">

                                <div class="modal-header">

                                    <h5 class="modal-title">
                                        Edit user
                                    </h5>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"
                                            aria-label="Close">
                                    </button>

                                </div>

                                <form id="editUserForm">

                                    <div class="modal-body">

                                        <input type="hidden"
                                               id="editUserId">

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                ID
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="editIdDisplay"
                                                   disabled>

                                        </div>

                                        <div class="mb-3">

                                            <label for="editFirstName"
                                                   class="form-label fw-bold">
                                                First name
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="editFirstName"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="editLastName"
                                                   class="form-label fw-bold">
                                                Last name
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="editLastName"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="editAge"
                                                   class="form-label fw-bold">
                                                Age
                                            </label>

                                            <input type="number"
                                                   class="form-control"
                                                   id="editAge"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="editEmail"
                                                   class="form-label fw-bold">
                                                Email
                                            </label>

                                            <input type="email"
                                                   class="form-control"
                                                   id="editEmail"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="editPassword"
                                                   class="form-label fw-bold">
                                                Password
                                            </label>

                                            <input type="password"
                                                   class="form-control"
                                                   id="editPassword"
                                                   autocomplete="new-password">

                                            <div class="form-text">
                                                Leave blank to keep the current password.
                                            </div>

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                Role
                                            </label>

                                            <div class="border rounded p-3 bg-light"
                                                 id="editRoles">
                                            </div>

                                        </div>

                                        <div class="alert alert-danger d-none"
                                             id="editError">
                                        </div>

                                    </div>

                                    <div class="modal-footer">

                                        <button type="button"
                                                class="btn btn-secondary"
                                                data-bs-dismiss="modal">
                                            Close
                                        </button>

                                        <button type="submit"
                                                class="btn btn-primary">
                                            Edit
                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                    <div class="modal fade"
                         id="deleteUserModal"
                         tabindex="-1"
                         aria-hidden="true">

                        <div class="modal-dialog">

                            <div class="modal-content">

                                <div class="modal-header">

                                    <h5 class="modal-title">
                                        Delete user
                                    </h5>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"
                                            aria-label="Close">
                                    </button>

                                </div>

                                <form id="deleteUserForm">

                                    <div class="modal-body">

                                        <input type="hidden"
                                               id="deleteUserId">

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                ID
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="deleteIdDisplay"
                                                   disabled>

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                First name
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="deleteFirstName"
                                                   disabled>

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                Last name
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="deleteLastName"
                                                   disabled>

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                Age
                                            </label>

                                            <input type="number"
                                                   class="form-control"
                                                   id="deleteAge"
                                                   disabled>

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                Email
                                            </label>

                                            <input type="email"
                                                   class="form-control"
                                                   id="deleteEmail"
                                                   disabled>

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                Role
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="deleteRoles"
                                                   disabled>

                                        </div>

                                        <div class="alert alert-danger d-none"
                                             id="deleteError">
                                        </div>

                                    </div>

                                    <div class="modal-footer">

                                        <button type="button"
                                                class="btn btn-secondary"
                                                data-bs-dismiss="modal">
                                            Close
                                        </button>

                                        <button type="submit"
                                                class="btn btn-danger">
                                            Delete
                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="tab-pane fade"
                     id="new-user-pane"
                     role="tabpanel">

                    <div class="card rounded-0 rounded-bottom">

                        <div class="card-header">

                            <h5 class="mb-0">
                                Add new user
                            </h5>

                        </div>

                        <div class="card-body">

                            <div class="row justify-content-center">

                                <div class="col-md-5">

                                    <form id="newUserForm">

                                        <div class="mb-3">

                                            <label for="newFirstName"
                                                   class="form-label fw-bold">
                                                First name
                                            </label>

                                            <input id="newFirstName"
                                                   type="text"
                                                   class="form-control"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="newLastName"
                                                   class="form-label fw-bold">
                                                Last name
                                            </label>

                                            <input id="newLastName"
                                                   type="text"
                                                   class="form-control"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="newAge"
                                                   class="form-label fw-bold">
                                                Age
                                            </label>

                                            <input id="newAge"
                                                   type="number"
                                                   class="form-control"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="newEmail"
                                                   class="form-label fw-bold">
                                                Email
                                            </label>

                                            <input id="newEmail"
                                                   type="email"
                                                   class="form-control"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label for="newPassword"
                                                   class="form-label fw-bold">
                                                Password
                                            </label>

                                            <input id="newPassword"
                                                   type="password"
                                                   class="form-control"
                                                   autocomplete="new-password"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label fw-bold">
                                                Role
                                            </label>

                                            <div class="border rounded p-3 bg-light"
                                                 id="newUserRoles">
                                            </div>

                                        </div>

                                        <div class="alert alert-danger d-none"
                                             id="newUserError">
                                        </div>

                                        <button type="submit"
                                                class="btn btn-success">
                                            Add new user
                                        </button>

                                    </form>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script th:src="@{/js/admin.js}"></script>

</body>
</html>
